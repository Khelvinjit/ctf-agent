[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ctf-agent"
version = "0.1.0"
description = "A budget-aware CTF-solving agent with a sandboxed tool loop."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic-settings>=2.2",
  "python-dotenv>=1.0",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["ctf_agent"]
